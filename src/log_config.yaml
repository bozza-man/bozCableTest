version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  simple:
    format: '%(asctime)s - %(levelname)s - %(message)s'
    datefmt: '%H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/cable_tester.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: standard
    filename: logs/errors.log
    maxBytes: 5242880  # 5MB
    backupCount: 3
    encoding: utf8
  
  security_file:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: standard
    filename: logs/security.log
    maxBytes: 5242880  # 5MB
    backupCount: 10
    encoding: utf8

loggers:
  backend:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false
  
  security:
    level: INFO
    handlers: [console, file, security_file, error_file]
    propagate: false
  
  usb_monitor:
    level: INFO
    handlers: [file]
    propagate: false
  
  bruteforce:
    level: WARNING
    handlers: [security_file, error_file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]